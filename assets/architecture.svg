<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title description" font-family="Montserrat,Arial,sans-serif">
  <title id="title">LLM &amp; RAG Architecture</title>
  <desc id="description">Reference architecture. The left two-thirds show a decoder-only transformer text-generation loop. The right third shows document indexing and question answering with retrieval-augmented generation.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#00F09C"/></marker>
    <style>
      text { font-family: Montserrat,Arial,sans-serif; }
      .label { font-size: 15px; font-weight: 600; }
      .small { font-size: 13px; font-weight: 500; }
      .subhead { font-size: 14px; font-weight: 700; letter-spacing: 1.1px; }
      .arrow { fill: none; stroke: #00F09C; stroke-width: 2.5; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #00F09C; stroke-width: 2; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="760" rx="20" fill="#FAF9FB"/>
  <!-- LLM: two-thirds -->
  <rect x="0" y="0" width="800" height="760" rx="20" fill="#001C5D"/>
  <rect x="780" y="0" width="20" height="760" fill="#001C5D"/>
  <text x="34" y="48" fill="#00F09C" font-size="25" font-weight="700">LLM &amp; RAG Architecture</text>
  <text x="34" y="78" fill="#FAF9FB" class="subhead">LLM · DECODER-ONLY GENERATION</text>
  <text x="824" y="78" fill="#001C5D" class="subhead">RAG · REFERENCE DESIGN</text>

  <!-- Generation pipeline -->
  <g fill="#001C5D" stroke="#00F09C" stroke-width="1.7">
    <rect x="32" y="128" width="94" height="66" rx="12"/>
    <rect x="153" y="128" width="94" height="66" rx="12"/>
    <rect x="274" y="128" width="104" height="66" rx="12"/>
    <rect x="406" y="128" width="116" height="66" rx="12"/>
    <rect x="550" y="128" width="112" height="66" rx="12"/>
    <rect x="690" y="128" width="78" height="66" rx="12"/>
  </g>
  <g fill="#FAF9FB" text-anchor="middle" class="label">
    <text x="79" y="167">Prompt</text>
    <text x="200" y="167">Tokenizer</text>
    <text x="326" y="157"><tspan x="326">Token</tspan><tspan x="326" dy="19">embeddings</tspan></text>
    <text x="464" y="157"><tspan x="464">Decoder</tspan><tspan x="464" dy="19">blocks × N</tspan></text>
    <text x="606" y="157"><tspan x="606">Next-token</tspan><tspan x="606" dy="19">probabilities</tspan></text>
    <text x="729" y="157"><tspan x="729">Select</tspan><tspan x="729" dy="19">token</tspan></text>
  </g>
  <path class="arrow" d="M128 161 H146 M249 161 H267 M380 161 H399 M524 161 H543 M664 161 H683"/>

  <!-- Decoder internals -->
  <text x="34" y="246" fill="#00F09C" class="subhead">INSIDE A DECODER BLOCK</text>
  <rect x="32" y="268" width="350" height="108" rx="14" fill="#001C5D" stroke="#00F09C" stroke-width="1.7"/>
  <rect x="51" y="294" width="143" height="56" rx="10" fill="#001C5D" stroke="#00F09C" stroke-width="1.4"/>
  <rect x="220" y="294" width="143" height="56" rx="10" fill="#001C5D" stroke="#00F09C" stroke-width="1.4"/>
  <text x="122" y="318" fill="#FAF9FB" text-anchor="middle" class="small"><tspan x="122">Causal</tspan><tspan x="122" dy="18">self-attention</tspan></text>
  <text x="291" y="318" fill="#FAF9FB" text-anchor="middle" class="small"><tspan x="291">Feed-forward</tspan><tspan x="291" dy="18">network</tspan></text>
  <path class="thin" d="M196 322 H212"/>
  <text x="32" y="407" fill="#FAF9FB" class="small">Masked attention uses earlier tokens only.</text>

  <!-- Generation loop -->
  <path class="arrow" d="M729 200 V478 H20 V161 H28"/>
  <rect x="253" y="459" width="320" height="38" rx="19" fill="#001C5D"/>
  <text x="413" y="484" fill="#FAF9FB" text-anchor="middle" class="small">Append token and repeat</text>
  <text x="34" y="512" fill="#00F09C" class="subhead">TEXT EMERGES ONE TOKEN AT A TIME</text>
  <text x="34" y="542" fill="#FAF9FB" class="small">The selected token is appended to the context, then the model predicts again.</text>

  <!-- RAG panel -->
  <text x="824" y="120" fill="#001C5D" class="subhead">1 · INDEX DOCUMENTS</text>
  <g fill="#FAF9FB" stroke="#00F09C" stroke-width="1.7">
    <rect x="824" y="143" width="78" height="62" rx="11"/>
    <rect x="923" y="143" width="78" height="62" rx="11"/>
    <rect x="1022" y="143" width="70" height="62" rx="11"/>
    <rect x="1112" y="143" width="70" height="62" rx="11"/>
  </g>
  <g fill="#001C5D" text-anchor="middle" class="small">
    <text x="863" y="179">Documents</text>
    <text x="962" y="179">Chunk</text>
    <text x="1057" y="179">Embed</text>
    <text x="1147" y="168"><tspan x="1147">Vector</tspan><tspan x="1147" dy="17">index</tspan></text>
  </g>
  <path class="thin" d="M904 174 H916 M1003 174 H1015 M1094 174 H1105"/>

  <text x="824" y="260" fill="#001C5D" class="subhead">2 · ANSWER WITH RETRIEVAL</text>
  <g fill="#FAF9FB" stroke="#00F09C" stroke-width="1.7">
    <rect x="824" y="286" width="96" height="62" rx="11"/>
    <rect x="950" y="286" width="100" height="62" rx="11"/>
    <rect x="1080" y="286" width="102" height="62" rx="11"/>
    <rect x="934" y="452" width="174" height="64" rx="12"/>
    <rect x="970" y="565" width="102" height="58" rx="11"/>
    <rect x="916" y="663" width="210" height="60" rx="12"/>
  </g>
  <g fill="#001C5D" text-anchor="middle" class="small">
    <text x="872" y="322">Question</text>
    <text x="1000" y="312"><tspan x="1000">Embed</tspan><tspan x="1000" dy="17">query</tspan></text>
    <text x="1131" y="310"><tspan x="1131">Retrieve</tspan><tspan x="1131" dy="17">passages</tspan></text>
    <text x="1021" y="489" class="label">Build prompt</text>
    <text x="1021" y="600" class="label">LLM</text>
    <text x="1021" y="699" class="label">Answer with sources</text>
  </g>
  <!-- question and retrieval path -->
  <path class="thin" d="M922 317 H943 M1052 317 H1073"/>
  <path class="thin" d="M1147 208 V275 H1131 V279"/>
  <text x="1154" y="246" fill="#001C5D" font-size="11" font-weight="600">vectors</text>
  <path class="thin" d="M872 352 V420 H972 V445"/>
  <path class="thin" d="M1131 352 V420 H1070 V445"/>
  <text x="824" y="405" fill="#001C5D" font-size="12" font-weight="600">original question</text>
  <text x="1092" y="405" fill="#001C5D" font-size="12" font-weight="600">retrieved passages</text>
  <path class="thin" d="M1021 520 V558 M1021 627 V656"/>
</svg>
